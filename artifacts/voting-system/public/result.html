<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Results – Digital Voting System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --primary: #1a4f99; --primary-dark: #0f3b75; --primary-light: #e8f0fc; --text: #1a1a2e; --muted: #6b7280; --border: #e5e7eb; --bg: #f8fafc; --card: #ffffff; --success: #16a34a; --gold: #d97706; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.05rem; color: var(--primary); text-decoration: none; }
    nav a { font-size: 0.875rem; color: var(--muted); text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 6px; }
    nav a:hover { background: var(--primary-light); color: var(--primary); }
    main { flex: 1; padding: 2rem 1rem; max-width: 700px; margin: 0 auto; width: 100%; }
    .badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.8rem; border-radius: 999px; background: var(--primary-light); color: var(--primary); font-size: 0.78rem; font-weight: 600; margin-bottom: 1rem; }
    h1 { font-family: 'Libre Baskerville', serif; font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 2rem; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; text-align: center; }
    .stat-label { font-size: 0.78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: var(--primary); font-family: 'Libre Baskerville', serif; }
    .winner-card { background: linear-gradient(135deg, #fffbeb, #fef3c7); border: 1px solid #fde68a; border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem; }
    .winner-trophy { font-size: 2.5rem; }
    .winner-label { font-size: 0.75rem; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.2rem; }
    .winner-name { font-size: 1.35rem; font-weight: 700; }
    .winner-party { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
    .winner-votes { font-size: 0.85rem; font-weight: 600; color: var(--gold); margin-top: 0.25rem; }
    .candidates-section h2 { font-family: 'Libre Baskerville', serif; font-size: 1.25rem; margin-bottom: 1.25rem; }
    .candidate-result { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-bottom: 0.75rem; }
    .candidate-result.winner { border-color: #fde68a; background: #fffbeb; }
    .cand-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.875rem; }
    .cand-symbol { font-size: 1.75rem; }
    .cand-name { font-weight: 700; font-size: 1rem; }
    .cand-party { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; font-weight: 500; }
    .cand-votes { margin-left: auto; text-align: right; }
    .cand-vote-count { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
    .cand-pct { font-size: 0.8rem; color: var(--muted); }
    .bar-track { background: #f3f4f6; border-radius: 999px; height: 10px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-dark)); border-radius: 999px; transition: width 1s ease; }
    .candidate-result.winner .bar-fill { background: linear-gradient(90deg, var(--gold), #b45309); }
    .refresh-hint { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 1.5rem; }
    .home-link { display: block; text-align: center; margin-top: 1.5rem; color: var(--primary); font-weight: 600; font-size: 0.9rem; text-decoration: none; }
    .home-link:hover { text-decoration: underline; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 4rem auto; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .voted-banner { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 0.875rem 1.25rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--success); font-weight: 600; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Digital Voting System
    </a>
    <nav>
      <a href="/">🏠 Home</a>
      <a href="/admin.html">⚙️ Admin</a>
    </nav>
  </header>

  <main>
    <div class="badge">📊 Live Results</div>
    <h1>Election Results</h1>
    <p class="subtitle">Real-time vote counts updated live.</p>

    <div id="content">
      <div class="spinner"></div>
    </div>
  </main>

  <script>
    async function loadResults() {
      try {
        const res = await fetch('/api/results');
        const data = await res.json();
        render(data);
      } catch { document.getElementById('content').innerHTML = '<p style="color:red;text-align:center">Failed to load results.</p>'; }
    }

    async function checkVoter() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) return await res.json();
      } catch {}
      return null;
    }

    async function init() {
      const [voter] = await Promise.all([checkVoter(), loadResults()]);
      if (voter && voter.hasVoted) {
        const banner = document.createElement('div');
        banner.className = 'voted-banner';
        banner.innerHTML = '✅ Your vote has been recorded successfully. Thank you for participating!';
        document.getElementById('content').prepend(banner);
      }
    }

    function render(data) {
      const { candidates, totalVotes, totalVoters, winner } = data;
      const content = document.getElementById('content');

      let html = `
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">Total Votes</div>
            <div class="stat-value">${totalVotes}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Registered Voters</div>
            <div class="stat-value">${totalVoters}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Turnout</div>
            <div class="stat-value">${totalVoters > 0 ? Math.round((totalVotes / totalVoters) * 100) : 0}%</div>
          </div>
        </div>
      `;

      if (winner && totalVotes > 0) {
        html += `
          <div class="winner-card">
            <div class="winner-trophy">🏆</div>
            <div>
              <div class="winner-label">Current Leader</div>
              <div class="winner-name">${winner.symbol} ${winner.name}</div>
              <div class="winner-party">${winner.party}</div>
              <div class="winner-votes">${winner.voteCount} votes · ${winner.percentage}%</div>
            </div>
          </div>
        `;
      }

      html += '<div class="candidates-section"><h2>All Candidates</h2>';
      candidates.forEach(c => {
        const isWinner = winner && c.id === winner.id && totalVotes > 0;
        html += `
          <div class="candidate-result${isWinner ? ' winner' : ''}">
            <div class="cand-header">
              <div class="cand-symbol">${c.symbol}${isWinner ? ' 🏆' : ''}</div>
              <div>
                <div class="cand-name">${c.name}</div>
                <div class="cand-party">${c.party}</div>
              </div>
              <div class="cand-votes">
                <div class="cand-vote-count">${c.voteCount}</div>
                <div class="cand-pct">${c.percentage}%</div>
              </div>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${c.percentage}%"></div>
            </div>
          </div>
        `;
      });
      html += '</div>';

      if (totalVotes === 0) {
        html += '<p style="text-align:center;color:var(--muted);margin-top:1rem;font-size:0.9rem">No votes have been cast yet.</p>';
      }

      html += `
        <div class="refresh-hint">Results refresh automatically every 10 seconds</div>
        <a class="home-link" href="/">← Back to Home</a>
      `;

      content.innerHTML = html;
    }

    init();
    setInterval(loadResults, 10000);
  </script>
</body>
</html>
