<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cast Your Vote – Digital Voting System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --primary: #1a4f99; --primary-dark: #0f3b75; --primary-light: #e8f0fc; --text: #1a1a2e; --muted: #6b7280; --border: #e5e7eb; --bg: #f8fafc; --card: #ffffff; --success: #16a34a; --error: #dc2626; --error-bg: #fef2f2; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.05rem; color: var(--primary); text-decoration: none; }
    nav a { font-size: 0.875rem; color: var(--muted); text-decoration: none; padding: 0.4rem 0.8rem; border-radius: 6px; }
    main { flex: 1; padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { max-width: 560px; width: 100%; }
    .badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.8rem; border-radius: 999px; background: var(--primary-light); color: var(--primary); font-size: 0.78rem; font-weight: 600; margin-bottom: 1rem; }
    h1 { font-family: 'Libre Baskerville', serif; font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.75rem; }
    .steps { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.75rem; }
    .step { display: flex; align-items: center; gap: 0.4rem; }
    .step-dot { width: 26px; height: 26px; border-radius: 50%; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .step-dot.done { background: var(--success); color: #fff; }
    .step-dot.active { background: var(--primary); color: #fff; }
    .step-dot.inactive { background: #f3f4f6; color: var(--muted); }
    .step-label { font-size: 0.75rem; font-weight: 500; }
    .step-label.active { color: var(--primary); }
    .step-label.inactive { color: var(--muted); }
    .step-line { width: 24px; height: 2px; background: #e5e7eb; }
    .voter-info { background: var(--primary-light); border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.875rem; margin-bottom: 1.25rem; }
    .voter-info strong { color: var(--primary); }
    .warning-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.83rem; color: #92400e; margin-bottom: 1.5rem; }
    .candidates-list { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
    .candidate-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 1.1rem 1.25rem; cursor: pointer; display: flex; align-items: center; gap: 1rem; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; }
    .candidate-card:hover { border-color: var(--primary); background: var(--primary-light); }
    .candidate-card.selected { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 3px rgba(26,79,153,0.12); }
    .cand-symbol { font-size: 2rem; width: 52px; height: 52px; background: #fff; border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cand-info { flex: 1; }
    .cand-name { font-weight: 700; font-size: 1.05rem; }
    .cand-party { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; font-weight: 500; text-transform: uppercase; }
    .radio-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color 0.15s; }
    .candidate-card.selected .radio-dot { border-color: var(--primary); }
    .radio-inner { width: 12px; height: 12px; background: var(--primary); border-radius: 50%; display: none; }
    .candidate-card.selected .radio-inner { display: block; }
    .btn { width: 100%; height: 52px; border: none; border-radius: 12px; font-size: 0.975rem; font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 16px rgba(26,79,153,0.25); transition: opacity 0.15s; }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .loading-center { display: flex; justify-content: center; padding: 3rem 0; }
    .spinner-lg { width: 40px; height: 40px; border: 3px solid var(--primary-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
    .spinner-sm { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--card); border-radius: 20px; padding: 2rem; max-width: 380px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal h3 { font-family: 'Libre Baskerville', serif; font-size: 1.35rem; margin-bottom: 0.5rem; }
    .modal-desc { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .modal-candidate { background: var(--primary-light); border-radius: 12px; padding: 1rem; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .modal-symbol { font-size: 1.75rem; }
    .modal-name { font-weight: 700; font-size: 1.05rem; }
    .modal-party { font-size: 0.8rem; color: var(--muted); font-weight: 500; text-transform: uppercase; }
    .modal-warn { font-size: 0.82rem; color: var(--error); font-weight: 500; margin-bottom: 1.25rem; }
    .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .btn-cancel { height: 44px; border: 2px solid var(--border); border-radius: 10px; background: transparent; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; cursor: pointer; color: var(--text); }
    .btn-cancel:hover { background: var(--bg); }
    .btn-confirm { height: 44px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; }
    .vote-error { color: var(--error); font-size: 0.875rem; text-align: center; margin-top: 0.75rem; display: none; }
    .vote-error.show { display: block; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Digital Voting System
    </a>
    <nav>
      <a href="/result.html">📊 Results</a>
    </nav>
  </header>

  <main>
    <div class="container" id="pageContent">
      <div class="loading-center"><div class="spinner-lg"></div></div>
    </div>
  </main>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <h3>Confirm Your Vote</h3>
      <p class="modal-desc">You are about to cast your vote for:</p>
      <div class="modal-candidate">
        <div class="modal-symbol" id="confirmSymbol"></div>
        <div>
          <div class="modal-name" id="confirmName"></div>
          <div class="modal-party" id="confirmParty"></div>
        </div>
      </div>
      <p class="modal-warn">⚠️ This action cannot be undone. You can only vote once.</p>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" id="confirmBtn" onclick="castVote()">🗳️ Confirm Vote</button>
      </div>
      <div class="vote-error" id="voteError"></div>
    </div>
  </div>

  <script>
    let selectedCandidateId = null;
    let selectedCandidate = null;
    let candidates = [];

    async function init() {
      try {
        const meRes = await fetch('/api/auth/me', { credentials: 'include' });
        if (!meRes.ok) { window.location.replace('/'); return; }
        const voter = await meRes.json();
        if (voter.hasVoted) { window.location.replace('/result.html'); return; }

        const resultsRes = await fetch('/api/results');
        const data = await resultsRes.json();
        candidates = data.candidates;
        renderPage(voter);
      } catch { window.location.replace('/'); }
    }

    function renderPage(voter) {
      document.getElementById('pageContent').innerHTML = `
        <div class="badge">🗳️ Voting Booth</div>
        <h1>Cast Your Vote</h1>
        <p class="subtitle">Select one candidate and submit your vote.</p>
        <div class="steps">
          <div class="step"><div class="step-dot done">✓</div><span class="step-label inactive">Aadhar</span></div>
          <div class="step-line"></div>
          <div class="step"><div class="step-dot done">✓</div><span class="step-label inactive">Biometrics</span></div>
          <div class="step-line"></div>
          <div class="step"><div class="step-dot active">3</div><span class="step-label active">Vote</span></div>
        </div>
        <div class="voter-info">Voting as: <strong>${voter.name}</strong></div>
        <div class="warning-box">⚠️ You can only vote once. Your vote is final and cannot be changed after submission.</div>
        <div class="candidates-list" id="candidatesList"></div>
        <button class="btn" id="submitBtn" disabled onclick="openModal()">🗳️ &nbsp;Submit Vote</button>
      `;

      const list = document.getElementById('candidatesList');
      candidates.forEach(c => {
        const card = document.createElement('div');
        card.className = 'candidate-card';
        card.dataset.id = c.id;
        card.innerHTML = `
          <div class="cand-symbol">${c.symbol}</div>
          <div class="cand-info">
            <div class="cand-name">${c.name}</div>
            <div class="cand-party">${c.party}</div>
          </div>
          <div class="radio-dot"><div class="radio-inner"></div></div>
        `;
        card.addEventListener('click', () => {
          selectedCandidateId = c.id;
          selectedCandidate = c;
          document.querySelectorAll('.candidate-card').forEach(el => el.classList.remove('selected'));
          card.classList.add('selected');
          document.getElementById('submitBtn').disabled = false;
        });
        list.appendChild(card);
      });
    }

    function openModal() {
      if (!selectedCandidate) return;
      document.getElementById('confirmSymbol').textContent = selectedCandidate.symbol;
      document.getElementById('confirmName').textContent = selectedCandidate.name;
      document.getElementById('confirmParty').textContent = selectedCandidate.party;
      document.getElementById('voteError').classList.remove('show');
      document.getElementById('confirmModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('confirmModal').classList.remove('show');
    }

    async function castVote() {
      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-sm"></span>&nbsp; Submitting...';
      try {
        const res = await fetch('/api/voting/cast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ candidateId: selectedCandidateId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to cast vote');
        window.location.href = '/result.html';
      } catch (err) {
        const el = document.getElementById('voteError');
        el.textContent = err.message;
        el.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '🗳️ Confirm Vote';
      }
    }

    init();
  </script>
</body>
</html>
